<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Game pieces (colored circles) -->
  <!-- Red piece (top-left) -->
  <circle cx="140" cy="140" r="45" fill="#ef4444" filter="url(#shadow)"/>
  
  <!-- Blue piece (top-right) -->
  <circle cx="372" cy="140" r="45" fill="#3b82f6" filter="url(#shadow)"/>
  
  <!-- Green piece (bottom-left) -->
  <circle cx="140" cy="372" r="45" fill="#22c55e" filter="url(#shadow)"/>
  
  <!-- Yellow piece (bottom-right) -->
  <circle cx="372" cy="372" r="45" fill="#eab308" filter="url(#shadow)"/>
  
  <!-- Central dice -->
  <g filter="url(#shadow)">
    <!-- Dice body -->
    <rect x="206" y="206" width="100" height="100" rx="18" fill="white"/>
    
    <!-- Dice dots (showing 6) -->
    <circle cx="226" cy="226" r="8" fill="#1e293b"/>
    <circle cx="226" cy="256" r="8" fill="#1e293b"/>
    <circle cx="226" cy="286" r="8" fill="#1e293b"/>
    <circle cx="286" cy="226" r="8" fill="#1e293b"/>
    <circle cx="286" cy="256" r="8" fill="#1e293b"/>
    <circle cx="286" cy="286" r="8" fill="#1e293b"/>
  </g>
</svg>
