services:
  parchis:
    build:
      context: .
      dockerfile: Dockerfile
    image: parchis-game:latest
    container_name: parchis-game
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - server/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=super_secret_default_key_change_me_in_production
    volumes:
      # Persist the SQLite database
      # The database is created at /app/server/data inside the container
      - parchis_data:/app/server/data
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - parchis-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  parchis-network:
    driver: bridge

volumes:
  parchis_data: {}
